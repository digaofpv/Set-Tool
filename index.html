<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Set Tool</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Set Tool">
<meta name="theme-color" content="#141613">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one-column set sheet, sticky progress header, six-tab bottom bar; dark by design for use on set */
:root{
  --bg:#141613; --surface:#1D201B; --surface-2:#262A23; --line:#30342D;
  --fg:#F2F0EA; --muted:#A3A89D; --faint:#71766C;
  --gold:#F2C230; --dawn:#E9B04E; --day:#8DB27A; --dusk:#E08A6E; --aerial:#6FA8A8; --sound:#B49BD8;
  --done:#6FBF8A; --warn:#F2C230; --bad:#E5736A;
  --f-display:'Archivo',system-ui,-apple-system,sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --f-serif:'Instrument Serif',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line)}
.hrow{max-width:608px;margin:0 auto;display:flex;align-items:center;gap:14px}
.ring{width:52px;height:52px;flex:none;position:relative}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:500}
.htext{min-width:0;flex:1;text-align:left}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:center;gap:6px}
h1 .sw{font-size:12px;color:var(--faint)}
.alert{font-size:12.5px;color:var(--warn);margin-top:3px;font-weight:600}
.alert.ok{color:var(--done)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);min-height:38px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.group{margin-top:22px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.ghead h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.gsub{font-size:12.5px;color:var(--faint);margin-bottom:8px}
.count{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .25s}

.shot{border-bottom:1px solid var(--line)}
.srow{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.check{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;margin-top:1px;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;opacity:0}
.done>.srow .check,.eq.done .check{background:var(--done);border-color:var(--done)}
.done>.srow .check svg,.eq.done .check svg{opacity:1}
.sbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.stop{display:flex;gap:8px;align-items:baseline}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;width:28px}
.stitle{font-weight:600;font-size:15px}
.shot.done .stitle{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.sframe{font-size:13px;color:var(--muted);padding-left:36px}
.lens{font-size:12.5px;color:var(--gold);padding-left:36px}
.lens b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding-left:36px;margin-top:3px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.a{background:#3A3216;color:var(--gold)}
.tag.dual{background:#1E3236;color:#8FD3D3}
.dualnote{font-size:12.5px;color:#8FD3D3;padding-left:36px}
.mini .dl{font-family:var(--f-mono);font-size:10px;color:#8FD3D3;background:#1E3236;border-radius:4px;padding:1px 5px;flex:none;margin-left:6px}
.quote{font-family:var(--f-serif);font-size:19px;line-height:1.25;padding:8px 0;border-bottom:1px solid var(--line)}
.qlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.info{width:36px;height:36px;flex:none;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.info svg{width:18px;height:18px}
.dsec{margin-top:14px}
.dsec .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dsec p{margin:0;font-size:14.5px;line-height:1.5}
.dsc{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.dsc .frame{width:96px}
.tag.note{background:#24302A;color:var(--done)}
.more{padding:0 0 14px 42px;display:flex;flex-direction:column;gap:10px}
.takes{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.step{width:36px;height:36px;border-radius:10px;background:var(--surface-2);font-size:18px;font-weight:600}
.takes output{font-family:var(--f-mono);font-size:15px;color:var(--fg);min-width:22px;text-align:center}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
textarea{min-height:64px;resize:vertical;font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);flex:1;min-width:0}

.mini{display:flex;flex-direction:column;gap:2px}
.mini button{display:flex;gap:8px;align-items:center;text-align:left;padding:7px 0;font-size:13.5px;min-height:38px;width:100%}
.mbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center}
.mbox svg{width:12px;height:12px;opacity:0}
.mrow{display:flex;align-items:center;gap:4px}
.mini .mrow>button:first-child{flex:1;min-width:0;width:auto}
.mini .minfo{width:34px;min-height:34px;padding:0;justify-content:center}
.minfo{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.minfo svg{width:17px;height:17px}
.next{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-top:14px}
.next .ttl{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;margin:4px 0 2px}
.next .acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.next .acts .btn{margin:0;min-height:52px}
.mini .done .mbox{background:var(--done);border-color:var(--done)}
.mini .done .mbox svg{opacity:1}
.mini .done .t{color:var(--muted);text-decoration:line-through}
.mini .c{font-family:var(--f-mono);font-size:11px;color:var(--faint);width:26px;flex:none}
.mini .t{flex:1;min-width:0}
.mini .l{font-family:var(--f-mono);font-size:10.5px;color:var(--gold);flex:none;padding-left:6px}

.blk{background:var(--surface);border-radius:14px;padding:14px 14px 8px;margin-top:14px;border:1px solid transparent}
.blk.now{border-color:var(--gold)}
.blk.late{border-color:var(--bad)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.btime{font-family:var(--f-mono);font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.btitle{font-family:var(--f-display);font-weight:700;font-size:17px;margin:2px 0 4px}
.bnote{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.badge{font-family:var(--f-mono);font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.badge.now{background:var(--gold);color:#141613}
.badge.late{background:#5A2420;color:#FFD9D4}
.badge.ok{background:#24302A;color:var(--done)}
.badge.warn{background:#3A3216;color:var(--gold)}
.light{background:#2B2614;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px;color:#E9DDB4}
.light b{color:var(--gold)}

.scene{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.frame{width:112px;aspect-ratio:9/16;max-width:100%;border-radius:8px;overflow:hidden;position:relative}
.frame svg{width:100%;height:100%;display:block}
.frame .ost{position:absolute;left:6px;right:6px;bottom:8px;text-align:center;font-family:var(--f-serif);font-size:11.5px;line-height:1.1;color:#fff}
.scene .mini .l{display:none}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc-num{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.sc-tc{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.sc-title{font-weight:700;font-size:16px;margin:4px 0 2px}
.sc-desc{font-size:13px;color:var(--muted);margin:0 0 8px}

.card{background:var(--surface);border-radius:14px;padding:16px;margin-top:16px}
.card h3{margin:0 0 10px;font-family:var(--f-display);font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row2{display:flex;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sun{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sun div{background:var(--surface-2);border-radius:10px;padding:10px}
.sun .k{font-size:11.5px;color:var(--muted)}
.sun .v{font-family:var(--f-mono);font-size:17px;margin-top:2px}
.brow{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:13.5px;padding:6px 0}
.brow .bar{margin:0}
.brow .count{text-align:right}
.pend{list-style:none;margin:0;padding:0}
.pend li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.pend .code{width:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:12px;background:var(--gold);color:#141613;font-weight:700;font-size:15px;margin-top:12px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:#5A2420;color:#FFD9D4}
.btn.sm{min-height:38px;font-size:13.5px;width:auto;padding:0 14px;margin-top:0}
.hint{font-size:12.5px;color:var(--faint);margin:8px 0 0}
pre.report{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--bg);border-radius:10px;padding:12px;max-height:240px;overflow:auto;user-select:text;-webkit-user-select:text;margin:0}
.confirm{display:flex;gap:10px}

.eq{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.eq .check{width:26px;height:26px;border-radius:7px}
.eq .t{font-weight:600;font-size:14.5px}
.eq.done .t{color:var(--muted);text-decoration:line-through}
.eq .d{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.eq.gap .t{color:var(--warn)}
.doc{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.doc:last-child{border-bottom:0}
.dtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dtitle{font-weight:700;font-size:15px}
.dmeta{font-size:12.5px;color:var(--muted)}
.dnum{font-family:var(--f-mono);font-size:13px;user-select:text;-webkit-user-select:text}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.contact{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.contact .ph{font-family:var(--f-mono);user-select:text;-webkit-user-select:text}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav .tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--faint);border-radius:10px;min-height:48px}
nav button svg{width:21px;height:21px}
nav button[aria-selected="true"]{color:var(--gold);background:var(--surface-2)}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.prod{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.prod[aria-current="true"]{border-color:var(--gold)}

.slate{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.slate .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.slate .cell{border:2px solid #fff;border-radius:10px;padding:10px}
.slate .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#bbb}
.slate .v{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,9vw,54px);line-height:1.05;word-break:break-word}
.slate .take{grid-column:1/-1}
.slate .take .v{font-size:clamp(64px,26vw,140px);text-align:center}
.slate .prodn{font-family:var(--f-display);font-weight:800;font-size:20px}
.slate .acts{margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slate .acts button{min-height:56px;border-radius:12px;background:#222;font-weight:700;font-size:16px}
.slate .acts .good{background:var(--done);color:#0D1A12}
.slate select{background:#111;border-color:#444}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;z-index:40;max-width:90%}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="#262A23" stroke-width="5"/><circle id="ringArc" cx="26" cy="26" r="22" fill="none" stroke="#6FBF8A" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2"/></svg>
      <b id="pct">0%</b>
    </div>
    <button class="htext" data-act="prods" aria-label="Trocar de produção">
      <div class="eyebrow" id="hEyebrow">Set Tool</div>
      <h1><span id="hTitle">Carregando…</span><span class="sw">▾</span></h1>
      <div class="alert" id="alert"></div>
    </button>
  </div>
</header>

<main class="wrap">
  <section id="tab-dia" role="tabpanel"><div class="loading">Carregando a produção…</div></section>
  <section id="tab-planos" role="tabpanel" hidden></section>
  <section id="tab-board" role="tabpanel" hidden></section>
  <section id="tab-set" role="tabpanel" hidden></section>
  <section id="tab-docs" role="tabpanel" hidden></section>
  <section id="tab-fim" role="tabpanel" hidden></section>
</main>

<nav>
  <div class="tabs" role="tablist">
    <button role="tab" id="b-dia" data-tab="dia" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h4M7 17h7"/></svg>Ordem</button>
    <button role="tab" id="b-planos" data-tab="planos" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Planos</button>
    <button role="tab" id="b-board" data-tab="board" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="7" height="12" rx="1.5"/><rect x="14" y="4" width="7" height="12" rx="1.5"/><path d="M3 20h18"/></svg>Board</button>
    <button role="tab" id="b-set" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h16v11H4z"/><path d="M4 9l2-5 4 1-2 4M10 5l4 1-2 3M14 6l4 1-2 2"/></svg>Set</button>
    <button role="tab" id="b-docs" data-tab="docs" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>Docs</button>
    <button role="tab" id="b-fim" data-tab="fim" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Fim</button>
  </div>
</nav>
<div id="overlay"></div>
<div class="toast" id="toast" hidden></div>

<script>
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="#141613" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const SAFE='<rect x="6" y="12" width="78" height="118" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".5" stroke-dasharray="2 2"/>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtDate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const mins=h=>{const [a,b]=h.split(':').map(Number);return a*60+b};

/* ---------- storage ---------- */
const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let PREFS=store.get('settool:prefs',{slug:null,tab:'dia',filter:'todos'});
let INDEX=null, PRODS=[], PT=null, KIT=null, P=null, S=null, UI={open:null,confirmReset:false};

/* ---------- load ---------- */
async function getJSON(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u+' '+r.status);return r.json()}
async function boot(){
  try{
    [INDEX,KIT]=await Promise.all([getJSON('producoes/index.json'),getJSON('kit.json').catch(()=>({docs:[],cameraProfiles:[],midias:[],baterias:[]}))]);
    if(!INDEX.produtoras) INDEX={produtoras:[{slug:'bridge-films',nome:'Bridge Films',producoes:INDEX.producoes||[]}]};
    PRODS=INDEX.produtoras.flatMap(pt=>pt.producoes.map(p=>({...p,path:pt.slug+'/'+p.slug,ptSlug:pt.slug,produtora:pt.nome})));
    const qs=new URLSearchParams(location.search); const qp=qs.get('p'), qset=qs.get('set');
    const path=(qp&&PRODS.some(p=>p.path===qp))?qp:(PRODS.some(p=>p.path===PREFS.slug)?PREFS.slug:PRODS[0].path);
    if(qset&&qset.length>=12){const k='settool:'+path;const st=store.get(k,{});st.setCode=qset.toLowerCase();store.set(k,st);PREFS.tab='set';}
    if(qp||qset) history.replaceState(null,'',location.pathname);
    await openProd(path);
  }catch(e){
    document.getElementById('tab-dia').innerHTML=`<div class="card"><h3>Não consegui carregar os dados</h3><p class="hint">Abra o app uma vez com internet para ele guardar a produção no aparelho. Detalhe: ${esc(e.message)}</p></div>`;
  }
  try{FILEKEYS=new Set(await idb.keys())}catch(e){}
}
async function openProd(path){
  const meta=PRODS.find(p=>p.path===path);
  P=await getJSON(`producoes/${path}/producao.json`); P.path=path; WX.data=null; WX.at=null; WX.lastTry=0;
  PT=await getJSON(`producoes/${meta.ptSlug}/produtora.json`).catch(()=>({nome:meta.produtora,contatos:[]}));
  PREFS.slug=path;loadState();save();render();
  if(S.setCode) syncStart(S.setCode); else syncStop();
}

/* ---------- ordem do dia ---------- */
function renderDia(){
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  const today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`===P.date;
  let html='';
  html+=P.lightNote?`<div class="light">${P.lightNote}</div>`:'';
  for(const b of P.day){
    const items=b.shots.map(shotById).filter(Boolean);
    const st=stats(items), pendA=items.filter(s=>s.pri==='A'&&!S.done[s.id]).length;
    let cls='',badge=items.length?`<span class="count">${st.d}/${st.t}</span>`:'';
    if(items.length&&st.d===st.t) badge='<span class="badge ok">feito</span>';
    else if(today&&b.from){const f=mins(b.from),t=mins(b.to);
      if(nm>=f&&nm<t){cls=' now';badge='<span class="badge now">agora</span>'}
      else if(nm>=t&&pendA){cls=' late';badge=`<span class="badge late">${pendA} pendente${pendA>1?'s':''}</span>`}}
    html+=`<div class="blk${cls}" ${cls===' now'?'id="blkNow"':''}><div class="bhead"><span class="btime">${esc(b.t)}</span>${badge}</div>
      <div class="btitle">${esc(b.title)}</div><p class="bnote">${esc(b.note)}${b.lens?` <span style="color:var(--gold)">Lentes: ${esc(b.lens)}.</span>`:''}</p>

/* ---------- sun ---------- */
const RAD=Math.PI/180;
function sunPos(t,lat,lon){ // t = ms UTC
  const n=t/86400000+2440587.5-2451545.0;
  const L=(280.460+0.9856474*n)%360, g=((357.528+0.9856003*n)%360)*RAD;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*n)*RAD;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=(18.697374558+24.06570982441908*n)%24;
  const H=((gmst*15+lon)*RAD-ra);
  const la=lat*RAD;
  const el=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H))/RAD;
  let az=Math.atan2(-Math.sin(H),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(H))/RAD; az=(az+360)%360;
  return {el,az};
}
function sunDay(iso,lat,lon,tz){
  const [y,m,d]=iso.split('-').map(Number);
  const t0=Date.UTC(y,m-1,d,0,0)-tz*3600000;
  const els=[];for(let i=0;i<=1440;i++)els.push(sunPos(t0+i*60000,lat,lon).el);
  const cross=(lv,up)=>{for(let i=1;i<els.length;i++){if(up?(els[i-1]<lv&&els[i]>=lv):(els[i-1]>=lv&&els[i]<lv))return i}return null};
  const hm=i=>i==null?'—':`${pad(Math.floor(i/60))}:${pad(i%60)}`;
  let noon=0;els.forEach((e,i)=>{if(e>els[noon])noon=i});
  return {rise:hm(cross(-0.833,true)),set:hm(cross(-0.833,false)),gmA:hm(cross(-4,true)),gmB:hm(cross(6,true)),geA:hm(cross(6,false)),geB:hm(cross(-4,false)),noon:hm(noon),maxEl:els[noon],at:i=>els[i],t0};
}

const WX={data:null,at:null,loading:false,err:'',lastTry:0};
const WMO=c=>c===0?'Céu limpo':c<=1?'Quase limpo':c===2?'Parcialmente nublado':c===3?'Nublado':(c===45||c===48)?'Neblina':c<=57?'Garoa':c<=67?'Chuva':c<=77?'Neve':c<=82?'Pancadas de chuva':'Trovoadas';
function wxKey(){return 'settool:wx:'+P.path}
async function loadWeather(force){
  if(!P||!P.location) return;
  const cached=store.get(wxKey(),null);
  if(cached&&!WX.data){WX.data=cached.data;WX.at=cached.at}
  if(WX.loading) return;
  if(!force&&WX.at&&Date.now()-WX.at<30*60000) return;
  if(!force&&WX.lastTry&&Date.now()-WX.lastTry<120000) return;
  WX.lastTry=Date.now(); WX.loading=true;WX.err='';
  const L=P.location;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m,uv_index,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,weather_code&timezone=America%2FSao_Paulo&start_date=${P.date}&end_date=${P.date}&wind_speed_unit=kmh`;
  try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.error)throw new Error(j.reason||'erro');
    WX.data=j;WX.at=Date.now();store.set(wxKey(),{data:j,at:WX.at})}
  catch(e){WX.err=navigator.onLine?'Previsão indisponível para esta data ou sem resposta do serviço.':'Sem internet.'}
  WX.loading=false; if(PREFS.tab==='set') softRender();
}
const card16=d=>['N','NE','L','SE','S','SO','O','NO'][Math.round(d/45)%8];
function wxCard(){
  const h=WX.data?.hourly, dd=WX.data?.daily;
  const upd=WX.at?`atualizada às ${new Date(WX.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:'';
  if(!h||!h.time?.length){
    return `<div class="card"><h3>Previsão do tempo <span class="count">${fmtDate(P.date)}</span></h3><p class="hint" style="margin:0">${WX.loading?'Buscando previsão…':(WX.err||'A previsão aparece até 16 dias antes da gravação.')}</p><button class="btn sm ghost" data-act="wxreload" style="margin-top:10px">Atualizar</button></div>`;
  }
  const w0=mins(P.window.from), w1=mins(P.window.to);
  const idx=h.time.map((t,i)=>({i,m:Number(t.slice(11,13))*60})).filter(x=>x.m>=w0-60&&x.m<=w1);
  const inWin=idx.filter(x=>x.m>=w0-0&&x.m<w1);
  const maxOf=(arr,k)=>Math.max(...arr.map(x=>h[k][x.i]??0));
  const gust=maxOf(inWin,'wind_gusts_10m'), wind=maxOf(inWin,'wind_speed_10m'), rainP=maxOf(inWin,'precipitation_probability'), uv=maxOf(inWin,'uv_index'), cloud=Math.round(inWin.reduce((a,x)=>a+(h.cloud_cover[x.i]||0),0)/Math.max(1,inWin.length));
  const lim=P.droneBlock?.maxWindKmh||38;
  let drone,dc;
  if(gust>=lim||rainP>=60){drone='Não voar: rajadas ou chuva acima do limite';dc='var(--bad)'}

      <div><div class="k">Chuva na janela</div><div class="v">até ${rainP}%</div></div>
      <div><div class="k">Índice UV máx.</div><div class="v">${Math.round(uv)}${uv>=8?' · alto':''}</div></div>
    </div>

      <thead><tr style="color:var(--muted);text-align:left"><th style="padding:4px 6px 4px 0">Hora</th><th>Temp</th><th>Chuva</th><th>Vento/raj.</th><th>Dir.</th><th>Nuvens</th><th>UV</th></tr></thead>

function dayCard(){

/* ---------- mídia e bateria ---------- */
function mediaCard(winLen){
  const cams=KIT.cameraProfiles||[]; if(!cams.length) return '';
  const cam=cams.find(c=>c.id===S.cam)||cams[0];
  const modo=cam.modos.find(m=>m.res===S.res)||cam.modos[0];
  const codecs=Object.keys(modo.codecs);
  const codec=codecs.includes(S.codec)?S.codec:(codecs.includes('BRAW 8:1')?'BRAW 8:1':codecs[0]);
  const fps=Number(S.fps)||24;
  const mbs=cam.fpsBase?modo.codecs[codec]*fps/cam.fpsBase:modo.codecs[codec];
  const midia=cam.midia||(KIT.midias||[])[0]||{nome:'Mídia',gb:0};
  const gb=Number(S.cardGb)||midia.gb;
  const minutes=mbs?Math.floor(gb*1000/mbs/60):null;
  const usePct=minutes?Math.round(winLen/minutes*100):null;
  const bat=(KIT.baterias||[])[0]||{nome:'Bateria',wh:0};
  const qty=Number(S.batQty)||1, watts=Number(S.batW)||cam.consumoW||20;
  const runMin=bat.wh&&cam.consumoW?Math.floor(bat.wh*0.85/watts*60):null;
  const total=runMin?runMin*qty:null;
  const hm=m=>`${Math.floor(m/60)}h ${pad(m%60)}min`;
  return `<div class="card"><h3>Mídia e bateria</h3>
    <label class="f" for="camSel">Câmera<select id="camSel" data-field="cam">${cams.map(c=>`<option value="${c.id}" ${c.id===cam.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
    <label class="f" for="resSel" style="margin-top:10px">Resolução<select id="resSel" data-field="res">${cam.modos.map(m=>`<option ${m.res===modo.res?'selected':''}>${esc(m.res)}</option>`).join('')}</select></label>
    <div class="row2" style="margin-top:10px"><label class="f" for="codecSel">Codec<select id="codecSel" data-field="codec">${codecs.map(c=>`<option ${c===codec?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    ${cam.fpsBase?`<label class="f" for="fps" style="flex:0 0 92px">Quadros/s<input id="fps" type="number" inputmode="decimal" data-field="fps" value="${esc(S.fps||24)}"></label>`:''}</div>
    <label class="f" for="cardGb" style="margin-top:10px">${esc(midia.nome)} (GB)<input id="cardGb" type="number" inputmode="decimal" data-field="cardGb" value="${esc(S.cardGb||midia.gb)}"></label>
    <div class="sun" style="margin-top:12px">
      <div><div class="k">Taxa de dados</div><div class="v">${mbs?mbs.toFixed(mbs<20?1:0):'—'} MB/s</div></div>
      <div><div class="k">Cabe na mídia</div><div class="v">${minutes==null?'—':hm(minutes)}</div></div>
    </div>
    ${usePct!=null?`<p class="hint" style="color:${usePct>=90?'var(--bad)':'var(--fg)'}">Gravando sem parar a janela inteira (${winLen} min), você usaria ${usePct}% da mídia.${usePct>=90?' Leve uma segunda mídia ou descarregue no intervalo.':''}</p>`:''}
    ${cam.consumoW?`<div class="row2" style="margin-top:14px"><label class="f" for="batQty">${esc(bat.nome)} (qtd.)<input id="batQty" type="number" inputmode="numeric" data-field="batQty" value="${esc(S.batQty||1)}"></label>
    <label class="f" for="batW">Consumo (W)<input id="batW" type="number" inputmode="decimal" data-field="batW" value="${esc(S.batW||cam.consumoW)}"></label></div>
    <div class="sun" style="margin-top:12px">
      <div><div class="k">Por bateria (${bat.wh} Wh)</div><div class="v">${runMin?hm(runMin):'—'}</div></div>
      <div><div class="k">Total vs. janela</div><div class="v" style="color:${total>=winLen?'var(--done)':'var(--bad)'}">${total?hm(total):'—'}</div></div>
    </div>
    <p class="hint">Autonomia estimada: ${bat.wh} Wh × 85% de aproveitamento ÷ consumo. ${esc(cam.nome)} com SSD pela USB-C fica perto de ${cam.consumoW} W; ajuste o consumo com o que você mede no set.</p>`:''}
    <p class="hint">${esc(cam.fonte)}.</p></div>`;
}

/* ---------- docs ---------- */
function validity(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-').map(Number); const days=Math.ceil((Date.UTC(y,m-1,d)-Date.now())/86400000);
  if(days<0) return '<span class="badge late">vencido</span>';
  if(days<=30) return `<span class="badge warn">vence em ${days} d</span>`;
  return `<span class="badge ok">válido até ${fmtDate(iso)}</span>`;
}
function docCard(doc,scope){
  const key=scope+':'+doc.id, has=FILEKEYS.has(key);
  return `<div class="doc"><div class="dtop"><span class="dtitle">${esc(doc.title)}</span>${validity(doc.valid)}</div>
    <div class="dmeta">${esc(doc.org)}${doc.detail?` · ${esc(doc.detail)}`:''}</div>

      ${doc.number?`<button class="btn sm ghost" data-act="copy" data-text="${esc(doc.number)}">Copiar nº</button>`:''}

}

/* ---------- fim do dia ---------- */
function report(){
  const d=new Date(), {d:dn,t}=stats(P.shots);
  let r=`SET TOOL · ${P.project||''} — ${P.title}\nRelatório ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}\nGravados: ${dn}/${t}\n`;
  if(P.entregas?.length){r+='\nEntregas\n';for(const e of P.entregas){const it=(e.shots||[]).map(shotById).filter(Boolean),st=stats(it);r+=`${e.titulo} (${e.formato}, ${e.duracao}): ${st.d}/${st.t} planos${st.d<st.t?' · faltam '+it.filter(x=>!S.done[x.id]).map(x=>x.id).join(', '):''}\n`}}
  for(const g of P.groups){const items=P.shots.filter(s=>s.g===g.id), st=stats(items);
    r+=`\n${g.name} (${st.d}/${st.t})\n`;
    for(const s of items) r+=`${S.done[s.id]?'[x]':'[ ]'} ${s.id} ${s.title}${s.dual?' · 9:16+16:9':''}${lensOf(s)?` · ${lensOf(s)}`:''}${S.takes[s.id]?` · ${S.takes[s.id]} takes`:''}${S.good[s.id]?` · bom: take ${S.good[s.id]}`:''}${S.notes[s.id]?` · ${S.notes[s.id].replace(/\n/g,' ')}`:''}\n`;}
  return r;
}
function renderFim(){
  const pendA=P.shots.filter(s=>s.pri==='A'&&!S.done[s.id]), pendB=P.shots.filter(s=>s.pri==='B'&&!S.done[s.id]);
  let html=`<div class="card"><h3>Por bloco</h3>${P.groups.map(g=>{const st=stats(P.shots.filter(s=>s.g===g.id));return `<div class="brow"><span>${esc(g.short)}</span><div class="bar"><i style="width:${st.d/st.t*100}%;background:${g.color}"></i></div><span class="count">${st.d}/${st.t}</span></div>`}).join('')}</div>`;
  html+=`<div class="card"><h3>${pendA.length?`Não saia sem estes (${pendA.length})`:'Indispensáveis: tudo gravado'}</h3>`+
    (pendA.length?`<ul class="pend">${pendA.map(s=>`<li><span class="code">${s.id}</span><span>${esc(s.title)}</span></li>`).join('')}</ul>`:`<p class="hint">Todos os planos indispensáveis estão marcados.</p>`)+
    (pendB.length?`<p class="hint">Mais ${pendB.length} extras pendentes.</p>`:'')+`</div>`;

/* ---------- sincronização da equipe (Firebase) ---------- */
const FB_V='10.14.1';
const FB_CFG={apiKey:"AIzaSyA3nN-iGSRMuqg2bs6y4JMudD5fDkrYmj8",authDomain:"set-tool-7e2df.firebaseapp.com",projectId:"set-tool-7e2df",storageBucket:"set-tool-7e2df.firebasestorage.app",messagingSenderId:"9646632908",appId:"1:9646632908:web:2f21943b266a9df273b769"};
const SYNC={on:false,status:'off',err:'',code:null,uid:null,devices:[],unsubs:[],timers:{},fs:null,db:null,auth:null,beat:null,pendingRender:false,started:false};
const deviceName=()=>PREFS.device||'Aparelho sem nome';
function genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let r='';const b=new Uint32Array(10);crypto.getRandomValues(b);b.forEach(x=>r+=a[x%a.length]);return (P.slug||'set').slice(0,14)+'-'+r}
function inviteLink(){const u=new URL(location.href.split('?')[0].split('#')[0]);u.searchParams.set('p',P.path);u.searchParams.set('set',SYNC.code||S.setCode);return u.toString()}
function softRender(){const a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox'))){SYNC.pendingRender=true;return}render()}
async function syncLoad(){
  if(SYNC.fs) return;
  const base=`https://www.gstatic.com/firebasejs/${FB_V}/`;
  const [appM,authM,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=appM.initializeApp(FB_CFG);
  let db; try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
  SYNC.fs=fs;SYNC.db=db;SYNC.auth=authM.getAuth(app);SYNC.authM=authM;
}
function syncStop(){SYNC.unsubs.forEach(u=>{try{u()}catch(e){}});SYNC.unsubs=[];clearInterval(SYNC.beat);SYNC.on=false;SYNC.code=null;SYNC.devices=[];SYNC.status='off'}
async function syncAuth(){
  const A=SYNC.authM;
  const user=await new Promise(res=>{const un=A.onAuthStateChanged(SYNC.auth,u=>{un();res(u)})});
  if(user) return user;
  return (await A.signInAnonymously(SYNC.auth)).user;
}
async function syncStart(code){
  if(!code||code.length<12||!P) return;
  syncStop(); SYNC.code=code; SYNC.on=true; SYNC.status='conectando'; SYNC.err=''; softRender();
  try{
    await syncLoad();
    const user=await syncAuth(); SYNC.uid=user.uid;
    if(SYNC.code!==code) return;
    const fs=SYNC.fs, db=SYNC.db;
    let first=true;
    SYNC.unsubs.push(fs.onSnapshot(fs.collection(db,'sets',code,'marks'),{includeMetadataChanges:true},snap=>{
      const remote=new Set();
      snap.forEach(d=>{remote.add(d.id);applyRemote(d.id,d.data())});
      if(first){first=false;const local=new Set([...Object.keys(S.done),...Object.keys(S.takes),...Object.keys(S.notes),...Object.keys(S.good)]);local.forEach(id=>{if(!remote.has(id))pushShot(id,true)})}
      SYNC.status=snap.metadata.fromCache?'offline':'ok'; save(); softRender();
    },err=>{SYNC.status='erro';SYNC.err=err.code||err.message;softRender()}));
    let firstEq=true;
    SYNC.unsubs.push(fs.onSnapshot(fs.collection(db,'sets',code,'eq'),snap=>{
      const remote=new Set();
      snap.forEach(d=>{remote.add(d.id);if(d.data().v)S.eq[d.id]=true;else delete S.eq[d.id]});
      if(firstEq){firstEq=false;Object.keys(S.eq).forEach(k=>{if(!remote.has(k))pushEq(k)})}
      save(); softRender();
    },()=>{}));
    const devRef=fs.doc(db,'sets',code,'devices',SYNC.uid);
    const beat=()=>fs.setDoc(devRef,{name:deviceName(),at:fs.serverTimestamp()},{merge:true}).catch(()=>{});
    beat(); SYNC.beat=setInterval(beat,60000);
    SYNC.unsubs.push(fs.onSnapshot(fs.collection(db,'sets',code,'devices'),snap=>{
      const now=Date.now(); SYNC.devices=[];
      snap.forEach(d=>{const v=d.data();const t=v.at?.toMillis?v.at.toMillis():now;if(now-t<180000)SYNC.devices.push({name:v.name||'Aparelho',me:d.id===SYNC.uid})});
      softRender();
    },()=>{}));
  }catch(e){const code=e.code||e.message||'';SYNC.status=(!navigator.onLine||/network|unavailable|offline/i.test(code))?'offline':'erro';SYNC.err=code;softRender()}
}
setInterval(()=>{if(S&&S.setCode&&(SYNC.status==='offline'||SYNC.status==='erro')&&navigator.onLine)syncStart(S.setCode)},30000);
function applyRemote(id,v){
  if(v.done)S.done[id]=true;else delete S.done[id];
  if(v.takes)S.takes[id]=v.takes;else delete S.takes[id];
  if(v.good)S.good[id]=v.good;else delete S.good[id];
  const typing=document.activeElement&&document.activeElement.id===`note-${id}`;
  if(!typing){if(v.note)S.notes[id]=v.note;else delete S.notes[id]}
}
function pushShot(id,now){
  if(!SYNC.on||!SYNC.fs||!SYNC.uid) return;
  clearTimeout(SYNC.timers[id]);
  const go=()=>{const fs=SYNC.fs;fs.setDoc(fs.doc(SYNC.db,'sets',SYNC.code,'marks',id),{done:!!S.done[id],takes:S.takes[id]||0,good:S.good[id]||null,note:S.notes[id]||'',by:deviceName(),at:fs.serverTimestamp()}).catch(e=>{SYNC.status='erro';SYNC.err=e.code||e.message;softRender()})};
  if(now) go(); else SYNC.timers[id]=setTimeout(go,500);
}
function pushEq(k){if(!SYNC.on||!SYNC.fs||!SYNC.uid)return;const fs=SYNC.fs;fs.setDoc(fs.doc(SYNC.db,'sets',SYNC.code,'eq',k),{v:!!S.eq[k],by:deviceName(),at:fs.serverTimestamp()}).catch(()=>{})}
window.addEventListener('online',()=>{if(S&&S.setCode&&(SYNC.status==='erro'||SYNC.status==='offline'))syncStart(S.setCode)});
function syncBadge(){
  if(!S||!S.setCode) return '';
  const n=SYNC.devices.length;
  const map={ok:['var(--done)',`sincronizado · ${n} aparelho${n===1?'':'s'}`],offline:['var(--gold)','sem sinal · envia quando voltar'],conectando:['var(--muted)','conectando…'],erro:['var(--bad)','erro na sincronização'],off:['var(--faint)','sincronização parada']};
  const [c,t]=map[SYNC.status]||map.off;
  return `<span style="color:${c}">● ${t}</span>`;
}
function syncCard(){
  if(!S.setCode){
    return `<div class="card"><h3>Sincronização da equipe</h3>
      <p class="hint" style="margin:0 0 10px">Marcações, takes, notas e checklist aparecem em todos os aparelhos do set em tempo real. Sem sinal, o app continua funcionando e envia tudo quando a conexão voltar.</p>
      <label class="f" for="devName">Nome deste aparelho<input id="devName" type="text" data-pref="device" value="${esc(PREFS.device||'')}" placeholder="Ex.: iPhone Rodrigo"></label>
      <button class="btn" data-act="synccreate">Criar set para esta produção</button>
      <div class="row2" style="margin-top:12px;align-items:flex-end"><label class="f" for="joinCode">Ou entre com um código<input id="joinCode" type="text" autocapitalize="off" autocomplete="off" placeholder="art-hunter-mon-xxxxxxxxxx"></label><button class="btn sm ghost" data-act="syncjoin" style="min-height:46px">Entrar</button></div></div>`;
  }
  const n=SYNC.devices.length;
  return `<div class="card"><h3>Sincronização da equipe <span class="count">${syncBadge()}</span></h3>
    ${SYNC.status==='erro'?`<p class="hint" style="color:var(--bad);margin:0 0 8px">Não consegui sincronizar (${esc(SYNC.err)}). As marcações continuam salvas neste aparelho.</p><button class="btn sm ghost" data-act="syncretry">Tentar de novo</button>`:''}
    <dl class="kv" style="margin-top:8px"><dt>Este aparelho</dt><dd>${esc(deviceName())}</dd><dt>No set agora</dt><dd>${n?SYNC.devices.map(d=>esc(d.name)+(d.me?' (este)':'')).join(', '):'—'}</dd><dt>Código</dt><dd class="dnum" style="word-break:break-all">${esc(S.setCode)}</dd></dl>
    <div id="qr" style="background:#fff;border-radius:12px;padding:12px;width:204px;height:204px;margin:14px auto 0"></div>
    <p class="hint" style="text-align:center">Aponte a câmera de outro iPhone para entrar neste set.</p>
    <button class="btn" data-act="syncshare">Compartilhar convite</button>
    <label class="f" for="devName2" style="margin-top:12px">Nome deste aparelho<input id="devName2" type="text" data-pref="device" value="${esc(PREFS.device||'')}" placeholder="Ex.: iPhone Rodrigo"></label>
    <button class="btn ghost" data-act="syncleave">Sair do set neste aparelho</button></div>`;
}
let qrLib=null;
function drawQR(){
  const el=document.getElementById('qr'); if(!el||!S.setCode) return;
  const draw=()=>{el.innerHTML='';try{new QRCode(el,{text:inviteLink(),width:180,height:180,colorDark:'#000000',colorLight:'#ffffff'})}catch(e){el.textContent='QR indisponível'}};
  if(window.QRCode) return draw();
  if(!qrLib){qrLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
  qrLib.then(draw).catch(()=>{el.style.height='auto';el.style.color='#000';el.textContent='Sem internet para gerar o QR. Use o código acima.'});

/* ---------- render + events ---------- */
const TABS=['dia','planos','board','set','docs','fim'];
function render(){
  if(!P) return;
  renderHeader();
  for(const t of TABS){document.getElementById('tab-'+t).hidden=PREFS.tab!==t;document.getElementById('b-'+t).setAttribute('aria-selected',PREFS.tab===t)}
  ({dia:renderDia,planos:renderPlanos,board:renderBoard,set:renderSet,docs:renderDocs,fim:renderFim})[PREFS.tab]();
  if(PREFS.tab==='set') drawQR();
  if(PREFS.tab==='dia'&&!scrolledNow){const el=document.getElementById('blkNow');if(el){scrolledNow=true;setTimeout(()=>el.scrollIntoView({block:'start',behavior:'smooth'}),50)}}
}
function copyText(txt,okMsg,selectEl){
  const fb=()=>{if(selectEl){const r=document.createRange();r.selectNodeContents(selectEl);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Texto selecionado: toque em Copiar')}else toast('Não foi possível copiar')};
  try{navigator.clipboard.writeText(txt).then(()=>toast(okMsg),fb)}catch(e){fb()}
}
document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){PREFS.tab=tab.dataset.tab;UI.confirmReset=false;save();render();window.scrollTo(0,0);return}
  const f=e.target.closest('[data-filter]'); if(f){PREFS.filter=f.dataset.filter;save();render();return}
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='INPUT'||b.tagName==='SELECT'||b.tagName==='TEXTAREA') return;
  const act=b.dataset.act, id=b.dataset.id||b.closest('[data-id]')?.dataset.id;
  if(act==='closeov'&&e.target!==b&&b.classList.contains('sheet')) return;
  switch(act){
    case 'toggle': S.done[id]=!S.done[id]; if(!S.done[id]) delete S.done[id]; save(); pushShot(id,true); render(); break;
    case 'open': UI.open=UI.open===id?null:id; render(); break;
    case 'plus': S.takes[id]=(S.takes[id]||0)+1; save(); pushShot(id); render(); break;
    case 'minus': S.takes[id]=Math.max(0,(S.takes[id]||0)-1); if(!S.takes[id]) delete S.takes[id]; save(); pushShot(id); render(); break;
    case 'eq': {const k=b.dataset.eq; S.eq[k]=!S.eq[k]; if(!S.eq[k]) delete S.eq[k]; save(); pushEq(k); render(); break}
    case 'copyrep': copyText(report(),'Relatório copiado',document.getElementById('rep')); break;
    case 'copy': copyText(b.dataset.text,'Número copiado'); break;
    case 'askreset': UI.confirmReset=true; render(); break;
    case 'cancel': UI.confirmReset=false; render(); break;
    case 'reset': {const ids=new Set([...Object.keys(S.done),...Object.keys(S.takes),...Object.keys(S.notes),...Object.keys(S.good)]);const eqs=Object.keys(S.eq);S.done={};S.notes={};S.takes={};S.good={};S.eq={};UI.confirmReset=false;save();ids.forEach(x=>pushShot(x,true));eqs.forEach(pushEq);render();toast(S.setCode?'Marcações apagadas em todos os aparelhos':'Marcações apagadas'); break}
    case 'prods': if(INDEX) renderProds(); break;
    case 'closeov': document.getElementById('overlay').innerHTML=''; break;
    case 'pick': document.getElementById('overlay').innerHTML=''; if(b.dataset.slug!==P.path){try{await openProd(b.dataset.slug)}catch(err){toast('Não consegui abrir essa produção')}} break;
    case 'slate': openSlate(id); break;
    case 'depo': openDepo(); break;
    case 'wxreload': loadWeather(true); render(); break;
    case 'sbshare': {const url=`producoes/${P.path}/${P.storyboardImage}`; const name=`Storyboard - ${P.project||P.title}.jpg`;
      try{const blob=await (await fetch(url)).blob(); const file=new File([blob],name,{type:'image/jpeg'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:`Storyboard · ${P.title}`,text:`Storyboard · ${P.project||''} · ${P.title}`})}
        else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Imagem baixada')}}
      catch(err){if(err&&err.name!=='AbortError')toast('Não consegui compartilhar a imagem')} break}
    case 'synccreate': if(!PREFS.device){toast('Dê um nome a este aparelho');document.getElementById('devName')?.focus();break} S.setCode=genCode(); save(); syncStart(S.setCode); toast('Set criado'); break;
    case 'syncjoin': {const c=(document.getElementById('joinCode')?.value||'').trim().toLowerCase(); if(c.length<12){toast('Código inválido');break} if(!PREFS.device)PREFS.device='Aparelho'; S.setCode=c; save(); syncStart(c); toast('Entrando no set…'); break}
    case 'syncretry': syncStart(S.setCode); break;
    case 'syncleave': syncStop(); delete S.setCode; save(); render(); toast('Este aparelho saiu do set'); break;
    case 'syncshare': {const url=inviteLink(); const text=`Set Tool · ${P.project||P.title}: entre no set pelo link`;
      if(navigator.share){navigator.share({title:'Set Tool',text,url}).catch(()=>{})} else copyText(url,'Link copiado'); break}
    case 'detail': openDetail(id); break;
    case 'closeslate': SLATE=null; renderSlate(); render(); break;
    case 'slatemin': SLATE.take=Math.max(1,SLATE.take-1); renderSlate(); break;
    case 'slatenext': S.takes[SLATE.id]=Math.max(S.takes[SLATE.id]||0,SLATE.take); SLATE.take++; save(); pushShot(SLATE.id); renderSlate(); break;
    case 'slategood': {const sid=SLATE.id,tk=SLATE.take; S.takes[sid]=Math.max(S.takes[sid]||0,tk); S.good[sid]=tk; S.done[sid]=true; save(); pushShot(sid,true); toast(`${sid}: take ${tk} marcado como bom`); SLATE=null; renderSlate(); render(); break}
    case 'docopen': {const rec=await idb.get(b.dataset.key).catch(()=>null); if(!rec){toast('Arquivo não encontrado');break}
      const url=URL.createObjectURL(rec.blob); const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); break}
    case 'docdel': try{await idb.del(b.dataset.key);FILEKEYS.delete(b.dataset.key);toast('Arquivo removido')}catch(err){toast('Não consegui remover')} render(); break;
  }
});

});
setInterval(()=>{if(PREFS.tab==='dia'||PREFS.tab==='set')render()},60000);

try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;

}}catch(e){}
